[project]
name = "annapurna-memorial-college-erp-backend"
version = "0.1.0"
description = "Annapurna Memorial College ERP & Sundarban Ashutosh B.Ed. College Enterprise API"
readme = "README.md"
authors = [
    { name = "Arnab Senapati", email = "senapatiarnab676@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "cloudinary>=1.47.0",
    "email-validator>=2.4.0",
    "fastapi>=0.165.0",
    "firebase-admin>=7.8.0",
    "httpx>=0.28.1",
    "motor>=3.7.1",
    "pydantic-settings>=2.16.3",
    "pydantic[email]>=2.14.4",
    "pyjwt[crypto]>=2.15.1",
    "pymongo>=4.20.0",
    "python-multipart>=0.0.34",
    "reportlab>=5.1.0",
    "resend>=2.55.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
annapurna-memorial-college-erp-backend = "annapurna_memorial_college_erp_backend:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
